<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pico W Control Dashboard</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body {
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 480px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.4rem; margin: 0; color: #38bdf8; }
    .status-badge {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: #1e293b;
      color: #94a3b8;
    }
    .status-badge.online { background: #064e3b; color: #34d399; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    .card-title {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    /* ช่องกรอก IP */
    .ip-bar { display: flex; gap: 8px; }
    .ip-bar input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
    }
    .ip-bar button {
      padding: 10px 16px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .ip-bar button:hover { background: #0369a1; }
    /* Ultrasonic */
    .distance-display {
      font-size: 3.2rem;
      font-weight: bold;
      color: #34d399;
      text-align: center;
    }
    .unit { font-size: 1.2rem; color: #94a3b8; }
    .bar-bg {
      width: 100%;
      height: 10px;
      background: #0f172a;
      border-radius: 5px;
      margin-top: 12px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #34d399, #38bdf8);
      transition: width 0.3s ease;
    }
    /* Keypad */
    .keypad-screen {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 15px;
      font-family: 'Courier New', monospace;
      font-size: 2.2rem;
      font-weight: bold;
      color: #facc15;
      text-align: right;
      letter-spacing: 4px;
      min-height: 68px;
      overflow-x: auto;
    }
    .btn-clear {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn-clear:hover { background: #dc2626; }
    /* Servo */
    .servo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .angle-val { font-size: 1.5rem; font-weight: bold; color: #38bdf8; }
    .btn-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 15px 0;
    }
    .btn-angle {
      padding: 12px;
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-angle:hover { background: #0284c7; border-color: #38bdf8; }
    input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Pico W Dashboard</h1>
    <span class="status-badge" id="conn-status">● รอการเชื่อมต่อ</span>
  </header>

  <!-- ตั้งค่า IP ของ Pico W -->
  <div class="card">
    <div class="card-title">ที่อยู่ IP ของ Raspberry Pi Pico W</div>
    <div class="ip-bar">
      <input type="text" id="pico-ip" placeholder="เช่น 192.168.1.105">
      <button onclick="saveIP()">บันทึก</button>
    </div>
  </div>

  <!-- 1. Ultrasonic -->
  <div class="card">
    <div class="card-title">ระยะทาง (Ultrasonic)</div>
    <div class="distance-display"><span id="dist">--</span> <span class="unit">cm</span></div>
    <div class="bar-bg"><div class="bar-fill" id="dist-bar"></div></div>
  </div>

  <!-- 2. Keypad -->
  <div class="card">
    <div class="card-title">ข้อมูลจาก Keypad (กด * บนบอร์ดเพื่อล้าง)</div>
    <div class="keypad-screen" id="keypad">-</div>
    <button class="btn-clear" onclick="clearKeypad()">ล้างข้อความ</button>
  </div>

  <!-- 3. Servo -->
  <div class="card">
    <div class="servo-header">
      <span class="card-title" style="margin:0;">ควบคุม Servo Motor</span>
      <span class="angle-val"><span id="angle-text">0</span>°</span>
    </div>
    <div class="btn-group">
      <button class="btn-angle" onclick="moveServo(0)">0°</button>
      <button class="btn-angle" onclick="moveServo(90)">90°</button>
      <button class="btn-angle" onclick="moveServo(180)">180°</button>
    </div>
    <input type="range" id="servo-slider" min="0" max="180" value="0" oninput="updateSliderText(this.value)" onchange="moveServo(this.value)">
  </div>
</div>

<script>
  let currentIP = localStorage.getItem('pico_ip') || '';
  document.getElementById('pico-ip').value = currentIP;

  function saveIP() {
    let val = document.getElementById('pico-ip').value.trim();
    val = val.replace(/^https?:\/\//, '').replace(/\/$/, '');
    currentIP = val;
    localStorage.setItem('pico_ip', val);
    alert('บันทึก IP: ' + val + ' เรียบร้อย');
  }

  setInterval(() => {
    if (!currentIP) return;
    fetch('http://' + currentIP + '/status')
      .then(res => res.json())
      .then(data => {
        const badge = document.getElementById('conn-status');
        badge.innerText = '● ออนไลน์';
        badge.classList.add('online');

        if (data.dist >= 0) {
          document.getElementById('dist').innerText = data.dist;
          document.getElementById('dist-bar').style.width = Math.min((data.dist / 100) * 100, 100) + '%';
        } else {
          document.getElementById('dist').innerText = 'เกินระยะ';
          document.getElementById('dist-bar').style.width = '0%';
        }
        document.getElementById('keypad').innerText = data.keypad || '-';
      })
      .catch(() => {
        const badge = document.getElementById('conn-status');
        badge.innerText = '● เชื่อมต่อไม่ได้ (เช็ก IP / Insecure Content)';
        badge.classList.remove('online');
      });
  }, 500);

  function updateSliderText(angle) {
    document.getElementById('angle-text').innerText = angle;
  }

  function moveServo(angle) {
    if (!currentIP) return alert('กรุณากรอก IP ของ Pico W ก่อน');
    document.getElementById('angle-text').innerText = angle;
    document.getElementById('servo-slider').value = angle;
    fetch('http://' + currentIP + '/servo?angle=' + angle);
  }

  function clearKeypad() {
    if (!currentIP) return;
    fetch('http://' + currentIP + '/clear');
  }
</script>

</body>
</html>
